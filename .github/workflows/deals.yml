name: deals-bot
on:
  schedule:
    - cron: "*/15 * * * *"   # كل 15 دقيقة
  workflow_dispatch:          # زر تشغيل يدوي
permissions:
  contents: write
concurrency: deals
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python deals_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: حفظ سجل الأسعار
        run: |
          git config user.name deals-bot && git config user.email bot@users.noreply.github.com
          git add deals.db && git commit -m "تحديث الأسعار" && git push || echo "لا تغييرات"
